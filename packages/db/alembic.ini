# Alembic configuration for the Vowcraft database package.
#
# The URL is deliberately absent: it comes from DATABASE_URL at runtime (see
# alembic/env.py). Committing a connection string to the repo is how staging credentials
# end up in a public history.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamped, sortable revision filenames — a migration directory ordered by name is
# worth more than four random hex characters.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
